# XKit & XClient CI — builds and tests XKit Swift SDK and XClient App on Xcode 27, then publishes GitHub Releases.
#
# Supports:
#   * xcode-27 runner image (Apple Silicon macOS with Xcode 27 toolchain)
#   * Comprehensive test matrix and Swift 6 strict concurrency checks
#   * Automated packaging of XKit SDK and XClient artifacts
#   * Rolling nightly releases on main push, immutable version releases on v* tags

name: Build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options: [release, debug]
        default: release
      runner:
        description: Runner image
        type: choice
        options: [xcode-27, macos-26, macos-15]
        default: xcode-27
      publish:
        description: Tag + release this build on success
        type: boolean
        default: true
      channel:
        description: Release channel (auto, nightly, release)
        type: choice
        options: [auto, nightly, release]
        default: auto

  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
  merge_group:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (XKit & XClient)
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      configuration: ${{ steps.summary.outputs.configuration }}
      version: ${{ steps.package.outputs.version }}
      artifact: xkit-sdk-${{ steps.summary.outputs.configuration }}-${{ github.run_number }}
      channel: ${{ steps.summary.outputs.channel }}
    env:
      CONFIGURATION: ${{ inputs.configuration || 'release' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            sdks/XKit/.build
            XAPP/XClient/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sdks/XKit/Package.swift', 'XAPP/XClient/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify toolchain
        run: |
          set -euo pipefail

          xcode_all="$(xcodebuild -version 2>/dev/null || echo 'Xcode not selected')"
          xcode="${xcode_all%%$'\n'*}"
          swift_all="$(swift --version 2>&1)"
          swift_line="${swift_all%%$'\n'*}"
          echo "Xcode:   $xcode"
          echo "Swift:   $swift_line"
          echo "macOS:   $(sw_vers -productVersion) ($(uname -m))"

          {
            echo "### Toolchain"
            echo "| | |"
            echo "|---|---|"
            echo "| Xcode | $xcode |"
            echo "| Swift | $swift_line |"
            echo "| OS | $(sw_vers -productVersion) ($(uname -m)) |"
            echo "| Runner | ${{ inputs.runner || 'xcode-27' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test XKit (Unit & Contract Suites)
        run: |
          set -euo pipefail
          cd sdks/XKit
          swift test
          swift run XKitCLI test-all

      - name: Build XKit Release
        run: |
          set -euo pipefail
          cd sdks/XKit
          config_lower=$(echo "${CONFIGURATION}" | tr '[:upper:]' '[:lower:]')
          swift build -c "$config_lower"

      - name: Test XClient (UI, Navigation, Concurrency Suites)
        run: |
          set -euo pipefail
          cd XAPP/XClient
          swift test -Xswiftc -strict-concurrency=complete

      - name: Verify XClientApp Headless Smoke Test
        run: |
          set -euo pipefail
          cd XAPP/XClient
          swift run XClientApp --verify

      - name: Build XClient Release
        run: |
          set -euo pipefail
          cd XAPP/XClient
          config_lower=$(echo "${CONFIGURATION}" | tr '[:upper:]' '[:lower:]')
          swift build -c "$config_lower"

      - name: Build & Archive iOS App (Official Xcode Project)
        run: |
          set -euo pipefail
          cd XAPP/XClient
          xcodebuild archive \
            -project XClient.xcodeproj \
            -scheme XClient \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "${RUNNER_TEMP}/XClient-iOS.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Artifacts
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          
          # Derive version from git tag or fallback to version file / run number
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.1.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          config_lower=$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')

          xkit_bin_dir=""
          for candidate in "sdks/XKit/.build/${config_lower}" "sdks/XKit/.build/${CONFIGURATION}" sdks/XKit/.build/*-apple-macosx/"${config_lower}"; do
            if [ -f "${candidate}/XKitCLI" ]; then
              xkit_bin_dir="$candidate"
              break
            elif [ -d "$candidate" ] && [ -z "$xkit_bin_dir" ]; then
              xkit_bin_dir="$candidate"
            fi
          done

          xclient_bin_dir=""
          for candidate in "XAPP/XClient/.build/${config_lower}" "XAPP/XClient/.build/${CONFIGURATION}" XAPP/XClient/.build/*-apple-macosx/"${config_lower}"; do
            if [ -f "${candidate}/XClientApp" ]; then
              xclient_bin_dir="$candidate"
              break
            elif [ -d "$candidate" ] && [ -z "$xclient_bin_dir" ]; then
              xclient_bin_dir="$candidate"
            fi
          done

          # Bundle binaries, SDK sources, and CLI
          mkdir -p "dist/XKit-${version}"
          if [ -n "$xkit_bin_dir" ] && [ -f "${xkit_bin_dir}/XKitCLI" ]; then
            cp "${xkit_bin_dir}/XKitCLI" "dist/XKit-${version}/"
          else
            echo "::error::XKitCLI binary not found in sdks/XKit/.build (${config_lower}, ${CONFIGURATION}, *-apple-macosx/${config_lower})"
            exit 1
          fi
          cp -r sdks/XKit/Sources "dist/XKit-${version}/"
          cp -r sdks/XKit/Tests "dist/XKit-${version}/"
          cp sdks/XKit/Package.swift "dist/XKit-${version}/"
          cp README.md "dist/XKit-${version}/" 2>/dev/null || true

          # Bundle standalone XClientApp executable and client package
          mkdir -p "dist/XClient-${version}"
          if [ -n "$xclient_bin_dir" ] && [ -f "${xclient_bin_dir}/XClientApp" ]; then
            cp "${xclient_bin_dir}/XClientApp" "dist/XClient-${version}/"
          else
            echo "::error::XClientApp binary not found in XAPP/XClient/.build (${config_lower}, ${CONFIGURATION}, *-apple-macosx/${config_lower})"
            exit 1
          fi
          # Preserve the relative SwiftPM dependency path used by XClient.
          mkdir -p "dist/XClient-${version}/XAPP/XClient" "dist/XClient-${version}/sdks/XKit"
          cp -r XAPP/XClient/Sources "dist/XClient-${version}/XAPP/XClient/"
          cp -r XAPP/XClient/Tests "dist/XClient-${version}/XAPP/XClient/"
          cp XAPP/XClient/Package.swift "dist/XClient-${version}/XAPP/XClient/"
          cp -r sdks/XKit/Sources "dist/XClient-${version}/sdks/XKit/"
          cp -r sdks/XKit/Tests "dist/XClient-${version}/sdks/XKit/"
          cp sdks/XKit/Package.swift "dist/XClient-${version}/sdks/XKit/"

          ( cd dist && zip -r "XClient-${version}.zip" "XClient-${version}" )
          cp "dist/XClient-${version}.zip" "dist/XClient.zip"
          rm -rf "dist/XClient-${version}"

          ( cd dist && zip -r "XKit-${version}.zip" "XKit-${version}" )
          cp "dist/XKit-${version}.zip" "dist/XKit.zip"
          rm -rf "dist/XKit-${version}"

          # Package iOS Sideloadable IPA from native .xcarchive
          mkdir -p "${RUNNER_TEMP}/Payload"
          cp -R "${RUNNER_TEMP}/XClient-iOS.xcarchive/Products/Applications/XClient.app" "${RUNNER_TEMP}/Payload/"
          ( cd "${RUNNER_TEMP}" && zip -qr "${GITHUB_WORKSPACE}/dist/XClient-${version}.ipa" Payload )
          cp "dist/XClient-${version}.ipa" "dist/XClient.ipa"
          rm -rf "${RUNNER_TEMP}/Payload"

      - name: Generate Checksums
        run: |
          set -euo pipefail
          ( cd dist && shasum -a 256 *.zip *.ipa > checksums.txt 2>/dev/null || true )
          cat dist/checksums.txt
          ls -lh dist/

      - name: Summary
        id: summary
        run: |
          set -euo pipefail
          version="${{ steps.package.outputs.version }}"
          CHANNEL="${{ inputs.channel || 'auto' }}"
          if [ "$CHANNEL" = "auto" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              CHANNEL="release"
            else
              CHANNEL="nightly"
            fi
          fi
          echo "configuration=$CONFIGURATION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          {
            echo "### XKit & XClient $version — $CONFIGURATION ($CHANNEL)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Channel | \`$CHANNEL\` |"
            echo "| XKit Zip | $(ls -lh dist/XKit-${version}.zip | awk '{print $5}') |"
            echo "| XClient Zip | $(ls -lh dist/XClient-${version}.zip | awk '{print $5}') |"
            echo "| XClient IPA | $(ls -lh dist/XClient-${version}.ipa | awk '{print $5}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload XKit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xkit-sdk-${{ env.CONFIGURATION }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  release:
    name: Tag and publish release
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.publish == true || inputs.publish == 'true')) ||
      (github.event_name != 'workflow_dispatch' &&
       (github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ needs.build.outputs.channel }}-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.build.outputs.channel }}
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Plan release
        id: plan
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(dist/*.zip)
          [ "${#zips[@]}" -gt 0 ] || { echo "::error::no zip in dist/ — refusing to publish a binary-less release"; exit 1; }
          [ -f dist/checksums.txt ] || { echo "::error::missing dist/checksums.txt"; exit 1; }

          echo "Target channel: $CHANNEL"
          if [ "$CHANNEL" = "nightly" ]; then
            TAG="nightly"
            TITLE="XKit Nightly Build"
            IS_PRERELEASE="true"
          else
            TAG="v${VERSION}"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG="$GITHUB_REF_NAME"
            fi
            TITLE="XKit $TAG"
            IS_PRERELEASE="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        if: steps.plan.outputs.is_prerelease != 'true'
        continue-on-error: true
        uses: actions/attest@v1
        with:
          subject-path: dist/*.zip

      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.zip dist/*.ipa dist/checksums.txt)
          TAG="${{ steps.plan.outputs.tag }}"
          TITLE="${{ steps.plan.outputs.title }}"
          IS_PRERELEASE="${{ steps.plan.outputs.is_prerelease }}"

          if [ "$TAG" = "nightly" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Existing $TAG release found. Deleting old release and tag..."
              gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            fi

            {
              echo "### XKit & XClient Nightly Build"
              echo
              echo "Automated build of the XKit SDK and XClient App from commit [\`${GITHUB_SHA:0:7}\`](https://github.com/${GH_REPO}/commit/${GITHUB_SHA}) on \`${GITHUB_REF_NAME}\`."
              echo
              echo "**Built:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "**Version:** \`${VERSION}\`"
              echo
              echo "#### Included Assets:"
              echo "- \`XClient-${VERSION}.ipa\` / \`XClient.ipa\` — Sideloadable iOS Application (AltStore, SideStore, TrollStore, LiveContainer)."
              echo "- \`XClient-${VERSION}.zip\` / \`XClient.zip\` — Native macOS desktop executable and client package."
              echo "- \`XKit-${VERSION}.zip\` / \`XKit.zip\` — Pure Swift 6 SDK sources and command-line verification tools."
              echo "- \`checksums.txt\` — SHA-256 integrity checksums."
            } > dist/release-notes.md

            if ! gh release create "$TAG" "${assets[@]}" \
              --title "$TITLE" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --notes-file dist/release-notes.md; then
              gh release upload "$TAG" "${assets[@]}" --clobber
              gh release edit "$TAG" --title "$TITLE" --prerelease --notes-file dist/release-notes.md || true
            fi
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::notice::release $TAG already exists — nothing to do."
              exit 0
            fi

            gh release create "$TAG" "${assets[@]}" \
              --title "$TITLE" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi

          gh release view "$TAG" --json url,tagName,isDraft,isPrerelease \
            --jq '"published \(.tagName) (draft=\(.isDraft) prerelease=\(.isPrerelease)) → \(.url)"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
